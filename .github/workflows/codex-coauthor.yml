# Codex 공동 출제: Claude 세션이 작업 지시서(output/build/기말/공동출제/<회차>_codex.md)를 푸시하면
# Codex CLI가 AGENTS.md·지시서대로 문항(c*.py)과 검증 스크립트를 만들어 codex/<회차> 브랜치에 푸시한다.
# 필요: 저장소 Settings → Secrets and variables → Actions → API_KEY (OpenAI 키)
name: codex-coauthor
on:
  push:
    branches: ['claude/**']
    paths: ['output/build/기말/공동출제/*_codex.md']
concurrency:
  group: codex-coauthor
  cancel-in-progress: false
jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      OPENAI_API_KEY: ${{ secrets.API_KEY || secrets.OPENAI_API_KEY }}
      CODEX_API_KEY: ${{ secrets.API_KEY || secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 키 확인
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "::error::저장소 시크릿 API_KEY가 없습니다"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 도구 설치
        run: |
          pip install sympy numpy matplotlib
          npm install -g @openai/codex
          codex --version
          printenv OPENAI_API_KEY | codex login --with-api-key
          codex login status
          # 지침·검사 스크립트가 /home/user/Finale 절대 경로를 쓰므로 같은 경로로 연결
          sudo mkdir -p /home/user && sudo ln -sfn "$GITHUB_WORKSPACE" /home/user/Finale
      - name: 지시서 찾기
        id: task
        run: |
          BEFORE='${{ github.event.before }}'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="${GITHUB_SHA}~1"; fi
          git -c core.quotePath=false diff --name-only "$BEFORE" "$GITHUB_SHA" -- 'output/build/기말/공동출제/*_codex.md' > /tmp/tasks.txt || true
          cat /tmp/tasks.txt
          test -s /tmp/tasks.txt
      - name: Codex 출제
        run: |
          git config user.name "codex-coauthor"
          git config user.email "codex-coauthor@users.noreply.github.com"
          BASE="$GITHUB_SHA"
          while IFS= read -r TASK; do
            [ -f "$TASK" ] || { echo "::error::지시서 파일 없음: $TASK"; exit 1; }
            ROUND="$(basename "$TASK" _codex.md)"
            BR="codex/${ROUND}"
            git checkout -B "$BR" "$BASE"
            mkdir -p "output/build/기말/${ROUND}/parts"
            PROMPT="AGENTS.md를 먼저 읽고 그대로 따른다. 작업 지시서 ${TASK}에 적힌 번호만 출제한다. 결과물은 output/build/기말/${ROUND}/parts/c*.py 와 verify_c*.py (그림은 같은 폴더 fig_c_*.svg). 각 verify 스크립트가 ALL OK, checkpart.py가 통과할 때까지 고친다. 마지막에 output/build/기말/${ROUND}/parts/CODEX_REPORT.md에 문항별 전문 요약·정답·변형 요약·검사 결과를 쓴다. git commit/push는 하지 않는다(워크플로가 한다)."
            codex exec -s workspace-write -c approval_policy="never" --skip-git-repo-check --color never "$PROMPT" 2>&1 | tee "/tmp/codex_${ROUND}.log" || true
            mkdir -p "output/build/기말/${ROUND}/parts"
            tail -c 200000 "/tmp/codex_${ROUND}.log" > "output/build/기말/${ROUND}/parts/CODEX_LOG.txt"
            git add "output/build/기말/${ROUND}/parts"
            git commit -m "Codex 공동 출제: ${ROUND} (${TASK})" || echo "변경 없음"
            git push -f origin "$BR"
          done < /tmp/tasks.txt
